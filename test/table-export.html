<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>表格字体导出验证</title></head>
<body>
<pre id="out">running…</pre>
<script src="../js/vendor/jszip.min.js"></script>
<script src="../js/constants.js"></script>
<script src="../js/knowledge.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ooxml.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/render.js"></script>
<script src="../js/legacy-doc.js"></script>
<script>
(async function () {
  var out = document.getElementById('out');
  function log(s) { out.textContent += '\n' + s; }
  try {
    var buf = await (await fetch('sample.docx?t=' + Date.now())).arrayBuffer();
    var doc = await Ooxml.open(buf, 'sample.docx');
    // 正文：宋体小四；表格：套用「论文三线表」模板
    var params = Store.merge(DFT.DEFAULT_PARAMS, {
      body: { enabled: true, cnFont: '宋体', latinFont: 'Times New Roman', size: 12 },
      table: { cnFont: '宋体', latinFont: 'Times New Roman' }
    });
    params = Store.merge(params, DFT.TABLE_TEMPLATES[0].params);
    var res = await Engine.process(doc, params);
    log('报告: ' + JSON.stringify(res.report));
    var r = await fetch('/save/out-tablefont.docx', { method: 'POST', body: res.blob });
    log('已保存 out-tablefont.docx -> ' + r.status);
    log('__DONE__');
  } catch (e) {
    log('ERROR ' + e.message + '\n' + e.stack);
    log('__DONE__');
  }
})();
</script>
</body>
</html>
