<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>引擎自动化测试</title>
<style>body{font-family:Consolas,monospace;font-size:12px}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">运行中…</pre>
<script src="../js/vendor/jszip.min.js"></script>
<script src="../js/constants.js"></script>
<script src="../js/knowledge.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ooxml.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/render.js"></script>
<script src="../js/legacy-doc.js"></script>
<script>
(function () {
  var log = [], failed = 0;
  function out(s) { log.push(s); document.getElementById('out').textContent = log.join('\n'); }
  function check(name, cond, extra) {
    if (!cond) failed++;
    out((cond ? '  [PASS] ' : '  [FAIL] ') + name + (extra !== undefined ? '  -> ' + extra : ''));
  }
  function texts(xmlDoc) {
    var ps = xmlDoc.getElementsByTagNameNS(Ooxml.NS.w, 'p'), arr = [];
    for (var i = 0; i < ps.length; i++) arr.push(Ooxml.paraText(ps[i], false));
    return arr;
  }
  function runsOf(xmlDoc) {
    return xmlDoc.getElementsByTagNameNS(Ooxml.NS.w, 'r');
  }
  function fontsOf(xmlDoc) {
    var set = {}, rs = runsOf(xmlDoc);
    for (var i = 0; i < rs.length; i++) {
      var rPr = Ooxml.getRPr(rs[i]); if (!rPr) continue;
      var rf = Ooxml.child(rPr, 'rFonts'); if (!rf) continue;
      var k = (rf.getAttributeNS(Ooxml.NS.w, 'eastAsia') || '') + '|' + (rf.getAttributeNS(Ooxml.NS.w, 'ascii') || '');
      set[k] = (set[k] || 0) + 1;
    }
    return set;
  }
  function httpGet(url) {
    return new Promise(function (res, rej) {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.responseType = 'arraybuffer';
      x.onload = function () { res(x.response); };
      x.onerror = function () { rej(new Error('网络/文件读取失败: ' + url)); };
      x.send();
    });
  }

  (async function () {
    try {
      out('== 1. 打开原始文档 ==');
      var buf = await httpGet('sample.docx');
      check('读取 sample.docx', buf && buf.byteLength > 1000, buf.byteLength + ' 字节');
      var doc = await Ooxml.open(buf, 'sample.docx');
      check('段落数 > 10', doc.stats.paragraphs > 10, doc.stats.paragraphs);
      check('识别到图片关系', doc.stats.images >= 1, doc.stats.images);
      check('样式表已解析', Object.keys(doc.styles).length > 3, Object.keys(doc.styles).join(','));

      var before = texts(doc.xml);
      out('  原文段落示例: ' + JSON.stringify(before.slice(1, 4)));

      out('== 2. 问题检测（analyze） ==');
      var an = Engine.analyze(doc, DFT.DEFAULT_PARAMS);
      check('发现排版问题', an.findings.length > 3, an.findings.map(function (f) { return f.id; }).join(','));
      out('  ' + an.findings.map(function (f) { return f.id + '(' + f.count + ')'; }).join(' '));

      out('== 3. 一键整改（process） ==');
      var params = Store.merge(DFT.DEFAULT_PARAMS, DFT.TEMPLATES[1].params); // 大学论文模板
      var t0 = Date.now();
      var res = await Engine.process(doc, params);
      check('生成新 docx blob', res.blob && res.blob.size > 1000, res.blob.size + ' 字节, ' + (Date.now() - t0) + 'ms');
      out('  统计: ' + JSON.stringify(res.report));

      out('== 4. 校验输出文档 ==');
      var buf2 = await res.blob.arrayBuffer();
      var doc2 = await Ooxml.open(buf2, 'out.docx');
      var after = texts(doc2.xml);
      check('输出可被重新解析', doc2.stats.paragraphs > 0, doc2.stats.paragraphs);
      check('图片未丢失', doc2.stats.images >= 1, doc2.stats.images);
      check('表格未丢失', doc2.stats.tables >= 1, doc2.stats.tables);
      check('空行已删除', after.length < before.length, before.length + ' -> ' + after.length);

      // 标点整改
      var joined = after.join('\n');
      check('半角逗号转中文', joined.indexOf('研究，内容') >= 0 || joined.indexOf('研究,内容') < 0, '有');
      check('小数点被保护(3.14)', joined.indexOf('3.14') >= 0 || joined.indexOf('3。14') < 0);
      check('千分位被保护(1,000)', joined.indexOf('1,000') >= 0);
      check('时间被保护(12:30)', joined.indexOf('12:30') >= 0 || joined.indexOf('12：30') >= 0);
      check('乱码字符已清除', joined.indexOf('\uFFFD') < 0 && joined.indexOf('\u200B') < 0);
      check('重复标点已合并', joined.indexOf('！！！') < 0 && joined.indexOf('。。。') < 0);
      check('全角数字转半角', joined.indexOf('１２３４５') < 0 && joined.indexOf('12345') >= 0);
      check('全角空格已清理', joined.indexOf('\u3000') < 0);

      // 字体分离
      var fset = fontsOf(doc2.xml);
      out('  字体组合: ' + JSON.stringify(fset));
      check('出现中文字体(宋体/黑体等)', Object.keys(fset).some(function (k) { return /宋体|黑体|楷体|仿宋|微软雅黑/.test(k); }));
      check('出现西文/数字字体(Times New Roman)', Object.keys(fset).some(function (k) { return /Times New Roman/.test(k); }));

      // 段落属性
      var sects = doc2.xml.getElementsByTagNameNS(Ooxml.NS.w, 'sectPr');
      var pgMar = Ooxml.child(sects[0], 'pgMar');
      var leftCm = parseInt(pgMar.getAttributeNS(Ooxml.NS.w, 'left'), 10) / 567;
      check('页边距已应用(左 3.17cm)', Math.abs(leftCm - 3.17) < 0.05, leftCm.toFixed(2) + 'cm');

      var indentCount = 0, jcCount = 0, spacingCount = 0, headingStyled = 0;
      var ps2 = doc2.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p');
      for (var i = 0; i < ps2.length; i++) {
        var pPr = Ooxml.getPPr(ps2[i]); if (!pPr) continue;
        var ind = Ooxml.child(pPr, 'ind');
        if (ind && (ind.getAttributeNS(Ooxml.NS.w, 'firstLineChars') === '200' ||
                    ind.getAttributeNS(Ooxml.NS.w, 'firstLine') === '480')) indentCount++;
        if (Ooxml.child(pPr, 'jc')) jcCount++;
        if (Ooxml.child(pPr, 'spacing')) spacingCount++;
      }
      check('存在首行缩进 2 字符的段落', indentCount > 3, indentCount + ' 段');
      check('存在对齐设置', jcCount > 3, jcCount + ' 段');
      check('存在行距设置', spacingCount > 3, spacingCount + ' 段');

      // OOXML 结构合法性：w:pPr 必须是段落第一个子元素，w:rPr 必须是 run 第一个子元素
      var badP = 0, badR = 0;
      var allP = doc2.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p');
      for (var ip = 0; ip < allP.length; ip++) {
        var pPr2 = Ooxml.getPPr(allP[ip]);
        if (pPr2 && allP[ip].firstElementChild !== pPr2) badP++;
      }
      var allR = doc2.xml.getElementsByTagNameNS(Ooxml.NS.w, 'r');
      for (var ir = 0; ir < allR.length; ir++) {
        var rPr2 = Ooxml.getRPr(allR[ir]);
        if (rPr2 && allR[ir].firstElementChild !== rPr2) badR++;
      }
      check('w:pPr 位置合法', badP === 0, badP + ' 处异常');
      check('w:rPr 位置合法', badR === 0, badR + ' 处异常');

      // rPr 子元素架构顺序合法性（w:rFonts 必须在 w:b / w:color / w:sz 之前）
      var order = Ooxml.RPR_ORDER, badOrder = 0;
      for (var io = 0; io < allR.length; io++) {
        var rp = Ooxml.getRPr(allR[io]); if (!rp) continue;
        var lastIdx = -1;
        for (var ic = 0; ic < rp.childNodes.length; ic++) {
          var cn = rp.childNodes[ic]; if (cn.nodeType !== 1) continue;
          var qi = order.indexOf('w:' + Ooxml.localName(cn));
          if (qi < 0) continue;
          if (qi < lastIdx) { badOrder++; break; }
          lastIdx = qi;
        }
      }
      check('w:rPr 子元素顺序合法', badOrder === 0, badOrder + ' 处异常');

      // 标题识别
      var h = Engine._internals.detectHeadingLevel(
        doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '一、研究现状', 0, params);
      check('汉字式编号识别为标题', h === 1, 'level=' + h);
      var h2 = Engine._internals.detectHeadingLevel(
        doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '1.2 技术路线', 0, DFT.DEFAULT_PARAMS);
      check('章节式编号 1.2 → 二级', h2 === 2, 'level=' + h2);
      var h2b = Engine._internals.detectHeadingLevel(
        doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '1.1.1 详细设计', 0, DFT.DEFAULT_PARAMS);
      check('章节式编号 1.1.1 → 三级', h2b === 3, 'level=' + h2b);
      var h2c = Engine._internals.detectHeadingLevel(
        doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '第一章 绪论', 0, DFT.DEFAULT_PARAMS);
      check('第X章 → 一级', h2c === 1, 'level=' + h2c);
      var h3 = Engine._internals.detectHeadingLevel(
        doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '这是一段普通正文内容，不应被识别为标题。', 0, DFT.DEFAULT_PARAMS);
      check('普通正文不识别为标题', h3 === 0, 'level=' + h3);
      // 小数不被误判为标题编号（表格数据行常见）
      ['2.85', '3.14', '68%', '2022', '1,000'].forEach(function (txt) {
        var lv = Engine._internals.detectHeadingLevel(
          doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], txt, 0, DFT.DEFAULT_PARAMS);
        check('数据「' + txt + '」不识别为标题', lv === 0, 'level=' + lv);
      });
      check('「3.14 是圆周率」不被误判为标题',
        Engine._internals.detectHeadingLevel(doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '3.14 是圆周率', 0, DFT.DEFAULT_PARAMS) === 0);
      check('「2.85 亿元」不被误判为标题',
        Engine._internals.detectHeadingLevel(doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '2.85 亿元', 0, DFT.DEFAULT_PARAMS) === 0);
      check('「1.1 研究背景」仍识别为二级',
        Engine._internals.detectHeadingLevel(doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '1.1 研究背景', 0, DFT.DEFAULT_PARAMS) === 2);
      check('「1. 研究方法」仍识别为一级',
        Engine._internals.detectHeadingLevel(doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '1. 研究方法', 0, DFT.DEFAULT_PARAMS) === 1);

      // 公式/单位保护
      var guard = Engine._internals.detectHeadingLevel(
        doc.xml.getElementsByTagNameNS(Ooxml.NS.w, 'p')[0], '温度 ≤ 25℃', 0, DFT.DEFAULT_PARAMS);
      check('含单位符号的短句不误判标题', guard === 0);

      out('== 5. 预览渲染 ==');
      var r1 = Render.render(doc, doc.xml, {});
      var r2 = Render.render(doc2, doc2.xml, {});
      check('原文预览生成', r1.html.length > 300, r1.html.length);
      check('整改后预览生成', r2.html.length > 300, r2.html.length);
      check('预览含图片', r2.html.indexOf('data:image/png;base64') >= 0);
      check('预览含表格', r2.html.indexOf('<table') >= 0);
      check('页面尺寸合理', r2.page.w > 15 && r2.page.h > 20, JSON.stringify(r2.page));

      out('== 6. 幂等性：重复处理不叠加 ==');
      var res2 = await Engine.process(doc, params);
      var buf3 = await res2.blob.arrayBuffer();
      var doc3 = await Ooxml.open(buf3, 'out2.docx');
      var after2 = texts(doc3.xml);
      check('两次处理结果一致', JSON.stringify(after2) === JSON.stringify(after),
        after2.length + ' vs ' + after.length);

      out('== 7. 旧格式解析 ==');
      check('docx 探测', LegacyDoc.detect(buf) === 'docx');

      // GBK 转义的 RTF
      var rtfGbk = await httpGet('sample-rtf-gbk.rtf');
      check('RTF(GBK) 探测', LegacyDoc.detect(rtfGbk) === 'rtf');
      var docR1 = await LegacyDoc.convert(rtfGbk, 't1.rtf');
      var rtfParas1 = texts(docR1.xml);
      out('  RTF(GBK) 段落: ' + JSON.stringify(rtfParas1));
      check('RTF(GBK) 中文正确解码', rtfParas1.join('|').indexOf('这是一个测试文件') >= 0, rtfParas1.join('|'));
      check('RTF 多段落拆分', rtfParas1.length === 2, rtfParas1.length);

      // 原始 UTF-8 的 RTF
      var rtfUtf = await httpGet('sample-rtf-utf8.rtf');
      var docR2 = await LegacyDoc.convert(rtfUtf, 't2.rtf');
      var rtfParas2 = texts(docR2.xml);
      check('RTF(UTF8) 中文正确解码', rtfParas2.join('|').indexOf('这是一个测试文件') >= 0, rtfParas2.join('|'));
      check('RTF 忽略 \\* 目标组', rtfParas2.join('|').indexOf('generator') < 0, rtfParas2.join('|'));

      // 对转换出来的文档跑一遍完整整改
      var resR = await Engine.process(docR1, DFT.DEFAULT_PARAMS);
      var docR3 = await Ooxml.open(await resR.blob.arrayBuffer(), 'r.docx');
      check('转换文档可被整改并导出', texts(docR3.xml).join('').indexOf('第二段内容') >= 0);

      out('== 8. 旧版 .doc 二进制解析 ==');
      var docBuf = await httpGet('sample-legacy.doc');
      check('.doc 探测为 OLE', LegacyDoc.detect(docBuf) === 'ole', LegacyDoc.detect(docBuf));
      var legDoc = await LegacyDoc.convert(docBuf, 'sample-legacy.doc');
      var legParas = texts(legDoc.xml);
      out('  .doc 段落: ' + JSON.stringify(legParas));
      var legJoined = legParas.join('\n');
      check('.doc 中文正文提取', legJoined.indexOf('这是正文,包含数字 3.14 与百分号 68%。') >= 0);
      check('.doc 段落符拆分正确', legParas.length === 6, legParas.length);
      check('.doc 单元格符转制表符', legJoined.indexOf('表内文本') >= 0);
      check('.doc 图片占位符', legJoined.indexOf('[图片]图1示意图') >= 0);
      check('.doc 域指令被剔除', legJoined.indexOf('HYPERLINK') < 0 && legJoined.indexOf('显示文本') >= 0);
      var resLeg = await Engine.process(legDoc, Store.merge(DFT.DEFAULT_PARAMS, DFT.TEMPLATES[0].params));
      var legOut = await Ooxml.open(await resLeg.blob.arrayBuffer(), 'leg.docx');
      var legOutTexts = texts(legOut.xml);
      out('  .doc 整改后: ' + JSON.stringify(legOutTexts));
      check('.doc 整改后标点已转中文', legOutTexts.join('').indexOf('这是正文，包含数字') >= 0);
      check('.doc 整改后可直接导出 docx', resLeg.blob.size > 2000, resLeg.blob.size);

      out('== 9. 表格文字独立格式 ==');
      check('检测到表格数量', an.stats.tables >= 1, an.stats.tables);
      check('统计到表格内段落', an.stats.tableParas > 0, an.stats.tableParas);
      check('问题清单含表格建议', an.findings.some(function (f) { return f.id === 'table_font'; }));

      function collectTableRuns(d) {
        var out2 = [], tbls = d.xml.getElementsByTagNameNS(Ooxml.NS.w, 'tbl');
        for (var ti = 0; ti < tbls.length; ti++) {
          var rows = Ooxml.children(tbls[ti], 'tr');
          for (var ri = 0; ri < rows.length; ri++) {
            var cells = Ooxml.children(rows[ri], 'tc');
            for (var ci = 0; ci < cells.length; ci++) {
              var ps = cells[ci].getElementsByTagNameNS(Ooxml.NS.w, 'p');
              for (var pi = 0; pi < ps.length; pi++) {
                var rs = ps[pi].getElementsByTagNameNS(Ooxml.NS.w, 'r');
                for (var rj = 0; rj < rs.length; rj++) {
                  var rPr = Ooxml.getRPr(rs[rj]); if (!rPr) continue;
                  var rf = Ooxml.child(rPr, 'rFonts'), sz = Ooxml.child(rPr, 'sz');
                  var b = Ooxml.child(rPr, 'b'), col = Ooxml.child(rPr, 'color');
                  var bv = b ? Ooxml.wval(b) : null;
                  out2.push({
                    row: ri,
                    text: rs[rj].textContent,
                    cn: rf ? (rf.getAttributeNS(Ooxml.NS.w, 'eastAsia') || '') : '',
                    en: rf ? (rf.getAttributeNS(Ooxml.NS.w, 'ascii') || '') : '',
                    sz: sz ? Ooxml.wval(sz) : '',
                    color: col ? Ooxml.wval(col) : '',
                    bold: b ? !(bv === '0' || bv === 'false') : false
                  });
                }
              }
            }
          }
        }
        return out2;
      }
      function fontHistogram(d) {
        var h = {}, rs = d.xml.getElementsByTagNameNS(Ooxml.NS.w, 'r');
        for (var i = 0; i < rs.length; i++) {
          var rPr = Ooxml.getRPr(rs[i]); if (!rPr) continue;
          var rf = Ooxml.child(rPr, 'rFonts'); if (!rf) continue;
          var f = rf.getAttributeNS(Ooxml.NS.w, 'eastAsia') || '';
          if (f) h[f] = (h[f] || 0) + 1;
        }
        return h;
      }

      var tParams = Store.merge(DFT.DEFAULT_PARAMS, {
        table: { enabled: true, cnFont: '黑体', latinFont: 'Arial', size: 9, sizeFollow: false, bold: false,
                 color: '#C00000', headerBold: true, applyParagraph: false }
      });
      var resT = await Engine.process(doc, tParams);
      var docT = await Ooxml.open(await resT.blob.arrayBuffer(), 'table.docx');
      var tRuns = collectTableRuns(docT);
      out('  表格 run 数=' + tRuns.length + '  示例=' + JSON.stringify(tRuns[0]));
      check('表格内文字已用表格中文字体(黑体)', tRuns.length > 0 && tRuns.every(function (r) { return r.cn === '黑体'; }),
        tRuns[0] && tRuns[0].cn);
      // 表格里的数字走「数字格式 → 表格数字」，中文字符走「表格文字格式」，两者分别断言
      function isDigitRun(r) { return /\d/.test(r.text || ''); }
      var cjkRuns = tRuns.filter(function (r) { return !isDigitRun(r); });
      var digRuns = tRuns.filter(isDigitRun);
      check('表格中文：9 磅 + 红色 C00000',
        cjkRuns.length > 0 && cjkRuns.every(function (r) { return r.sz === '18' && r.color === 'C00000'; }),
        JSON.stringify(cjkRuns.slice(0, 3)));
      check('表格数字：字体走"表格数字"、字号默认跟随表格',
        digRuns.length > 0 && digRuns.every(function (r) { return r.en === 'Times New Roman' && r.sz === '18'; }),
        JSON.stringify(digRuns.slice(0, 3)));
      var resDigInd = await Engine.process(doc, Store.merge(tParams, {
        digit: { table: { independent: true, size: 10.5 } }
      }));
      var docDigInd = await Ooxml.open(await resDigInd.blob.arrayBuffer(), 'digind.docx');
      var digInd = collectTableRuns(docDigInd).filter(function (r) { return /\d/.test(r.text); });
      check('勾选"独立设置数字字号"后，表格数字按专属字号(10.5磅=21)',
        digInd.length > 0 && digInd.every(function (r) { return r.sz === '21'; }), JSON.stringify(digInd.slice(0, 3)));
      var hdr = tRuns.filter(function (r) { return r.row === 0; });
      var bodyT = tRuns.filter(function (r) { return r.row > 0; });
      check('表头行已自动加粗', hdr.length > 0 && hdr.every(function (r) { return r.bold; }), hdr.length + ' 个 run');
      check('非表头行未被加粗', bodyT.length > 0 && bodyT.every(function (r) { return !r.bold; }), bodyT.length + ' 个 run');
      var hist = fontHistogram(docT);
      out('  全文中文字体分布=' + JSON.stringify(hist));
      check('正文未被表格字体影响(仍有宋体)', (hist['宋体'] || 0) > 0, JSON.stringify(hist));
      check('正文标题仍用黑体、表格也用黑体', (hist['黑体'] || 0) > 0);
      check('报告统计表格段落数', resT.report.tableParas > 0, resT.report.tableParas);

      // 表格段落版式（行距/对齐）默认不动，开启后才统一
      var tblP = docT.xml.getElementsByTagNameNS(Ooxml.NS.w, 'tbl')[0]
        .getElementsByTagNameNS(Ooxml.NS.w, 'p');
      var spacingOn = 0;
      for (var q = 0; q < tblP.length; q++) {
        var pp = Ooxml.getPPr(tblP[q]);
        if (pp && Ooxml.child(pp, 'spacing')) spacingOn++;
      }
      check('默认不改动表格行距', spacingOn < tblP.length, spacingOn + '/' + tblP.length);

      var resT2 = await Engine.process(doc, Store.merge(tParams, {
        table: { applyParagraph: true, lineMode: 'multiple', lineValue: 1.0, align: 'center' }
      }));
      var docT2 = await Ooxml.open(await resT2.blob.arrayBuffer(), 'table2.docx');
      var tbl2 = docT2.xml.getElementsByTagNameNS(Ooxml.NS.w, 'tbl')[0];
      var ps2 = tbl2.getElementsByTagNameNS(Ooxml.NS.w, 'p');
      var sp2 = 0, jc2 = 0;
      for (var q2 = 0; q2 < ps2.length; q2++) {
        var pp2 = Ooxml.getPPr(ps2[q2]);
        if (pp2 && Ooxml.child(pp2, 'spacing')) sp2++;
        if (pp2 && Ooxml.child(pp2, 'jc')) jc2++;
      }
      check('开启后表格行距已统一', sp2 >= ps2.length - 1, sp2 + '/' + ps2.length);
      check('开启后表格对齐已统一', jc2 >= ps2.length - 1, jc2 + '/' + ps2.length);

      check('图片版文档：被正确识别为"内容为图片"', scanDoc.stats.imageOnly === true);
      var resScan = await Engine.process(scanDoc, DFT.DEFAULT_PARAMS);
      var scanOut = await Ooxml.open(await resScan.blob.arrayBuffer(), 's.docx');
      check('图片版文档：导出后仍可正常打开', scanOut.stats.paragraphs >= 1 && scanOut.stats.images >= 1,
        scanOut.stats.paragraphs + ' 段 / ' + scanOut.stats.images + ' 图');
      check('图片版文档：导出后被识别为图片版（说明文字确实还是图片）', scanOut.stats.imageOnly === true);

      out('== 16. 回归：开启表格格式后绝不能把表格刷成黑底 ==');
      function countBlackFill(d) {
        var shds = d.xml.getElementsByTagNameNS(Ooxml.NS.w, 'shd'), n = 0;
        for (var i = 0; i < shds.length; i++) {
          var fill = (shds[i].getAttributeNS(Ooxml.NS.w, 'fill') || '').toUpperCase();
          if (fill === '000000' || fill === '00000000') n++;
        }
        return n;
      }
      var resBlk = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, { table: { enabled: true } }));
      var docBlk = await Ooxml.open(await resBlk.blob.arrayBuffer(), 'blk.docx');
      check('只开启表格格式、未启用底色时不会出现黑色底纹', countBlackFill(docBlk) === 0,
        countBlackFill(docBlk) + ' 个黑色底纹');
      var resBlk2 = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, {
        table: { enabled: true, borderEnabled: true, borderStyle: 'none', align: 'center', applyParagraph: true }
      }));
      var docBlk2 = await Ooxml.open(await resBlk2.blob.arrayBuffer(), 'blk2.docx');
      check('只改边框/对齐也不会误刷黑底', countBlackFill(docBlk2) === 0, countBlackFill(docBlk2) + ' 个');
      var resFill2 = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, {
        table: { enabled: true, headerFillOn: true, headerFill: '#DCE6F1', bodyFillOn: true, bodyFill: '#FFF2CC' }
      }));
      var docFill2 = await Ooxml.open(await resFill2.blob.arrayBuffer(), 'fill2.docx');
      var shdsAll = docFill2.xml.getElementsByTagNameNS(Ooxml.NS.w, 'shd'), okFill = 0;
      for (var sf = 0; sf < shdsAll.length; sf++) {
        var fv = (shdsAll[sf].getAttributeNS(Ooxml.NS.w, 'fill') || '').toUpperCase();
        if (fv === 'DCE6F1' || fv === 'FFF2CC') okFill++;
      }
      check('勾选"启用底色"后按指定颜色填充', okFill >= 6, okFill + ' 个单元格上色');
      check('启用底色时也没有黑色', countBlackFill(docFill2) === 0, countBlackFill(docFill2) + ' 个');
      var resNoFill = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, {
        table: { enabled: true, headerFillOn: false, headerFill: '#000000', bodyFillOn: false, bodyFill: '#000000' }
      }));
      var docNoFill = await Ooxml.open(await resNoFill.blob.arrayBuffer(), 'nofill.docx');
      check('未勾选启用时，即使颜色选择器停在黑色也不会写入', countBlackFill(docNoFill) === 0,
        countBlackFill(docNoFill) + ' 个');

      out('== 17. 字号一致性：表格/数字不得擅自比正文小 ==');
      function tableRunSizes(d) {
        var res = [], tbls = d.xml.getElementsByTagNameNS(Ooxml.NS.w, 'tbl');
        for (var i = 0; i < tbls.length; i++) {
          var rs = tbls[i].getElementsByTagNameNS(Ooxml.NS.w, 'r');
          for (var j = 0; j < rs.length; j++) {
            var rPr = Ooxml.getRPr(rs[j]); if (!rPr) continue;
            var sz = Ooxml.child(rPr, 'sz');
            if (sz && rs[j].textContent) res.push({ t: rs[j].textContent, sz: Ooxml.wval(sz) });
          }
        }
        return res;
      }
      var resF1 = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, {
        body: { size: 12 }, table: { enabled: true }        // 表格字号默认跟随正文
      }));
      var dF1 = await Ooxml.open(await resF1.blob.arrayBuffer(), 'sf1.docx');
      var sizesF1 = tableRunSizes(dF1);
      check('表格字号默认跟随正文（12磅=24）',
        sizesF1.length > 0 && sizesF1.every(function (r) { return r.sz === '24'; }),
        JSON.stringify(sizesF1.slice(0, 4)));

      var resF2 = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, {
        body: { size: 12 }, table: { enabled: true, sizeFollow: false, size: 9 }   // 显式指定表格 9 磅
      }));
      var dF2 = await Ooxml.open(await resF2.blob.arrayBuffer(), 'sf2.docx');
      var sizesF2 = tableRunSizes(dF2);
      check('关闭"跟随正文"后才使用表格专属字号（9磅=18）',
        sizesF2.length > 0 && sizesF2.every(function (r) { return r.sz === '18'; }),
        JSON.stringify(sizesF2.slice(0, 4)));

      // 正文数字：默认跟随正文（independent=false），开启独立后才用自己的字号
      function digitSizesIn(d, needle) {
        var p = findByText(d, needle);
        if (!p) return [];
        var out = [], rs = p.getElementsByTagNameNS(Ooxml.NS.w, 'r');
        for (var i = 0; i < rs.length; i++) {
          if (!/[0-9]/.test(rs[i].textContent)) continue;
          var rPr = Ooxml.getRPr(rs[i]); var sz = rPr ? Ooxml.child(rPr, 'sz') : null;
          if (sz) out.push(Ooxml.wval(sz));
        }
        return out;
      }
      var resD1 = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, {
        body: { size: 12 }, digit: { enabled: true, body: { font: 'Times New Roman', size: 9, independent: false } }
      }));
      var dD1 = await Ooxml.open(await resD1.blob.arrayBuffer(), 'sd1.docx');
      var bodyDigitSizes = digitSizesIn(dD1, '2023年营业收入');
      check('正文数字默认跟随正文字号（不勾选独立设置时）',
        bodyDigitSizes.length > 0 && bodyDigitSizes.every(function (v) { return v === '24'; }),
        JSON.stringify(bodyDigitSizes.slice(0, 6)));
      var resD2 = await Engine.process(doc, Store.merge(DFT.DEFAULT_PARAMS, {
        body: { size: 12 }, digit: { enabled: true, body: { font: 'Times New Roman', size: 9, independent: true } }
      }));
      var dD2 = await Ooxml.open(await resD2.blob.arrayBuffer(), 'sd2.docx');
      var digitSizes2 = digitSizesIn(dD2, '2023年营业收入');
      check('勾选"独立设置数字字号"后按数字专属字号（9磅=18）',
        digitSizes2.length > 0 && digitSizes2.every(function (v) { return v === '18'; }),
        JSON.stringify(digitSizes2.slice(0, 6)));

      out('== 18. 数字与单位规范（知识库驱动） ==');
      var kb = DFT.KNOWLEDGE;
      check('规范知识库已加载', !!kb && kb.categories.length >= 8,
        kb ? (kb.stats().categories + ' 类 / ' + kb.stats().items + ' 条 / ' +
              kb.stats().units + ' 个单位 / ' + kb.stats().wrongForms + ' 种错误写法') : '未加载');
      check('知识库条目都带示例与级别', !!kb && kb.categories.every(function (c) {
        return c.items.every(function (it) { return it.id && it.text && it.level && (it.ok || it.bad); });
      }));
      var uOpt = { halfWidth: true, fixSpelling: true, celsius: 'degree', celsiusSpace: true,
        spaceNumber: true, tightPercent: true, mathSpace: true, timesSign: true,
        slashTight: true, superDigit: true };
      var unitCases = [
        ['10μL', '10 μL'], ['15KD', '15 kDa'], ['95 %', '95%'], ['P<0.05', 'P < 0.05'],
        ['3 x 10', '3 × 10'], ['5 ng / μL', '5 ng/μL'], ['500 ml', '500 mL'], ['30 sec', '30 s'],
        ['12000 RPM', '12000 rpm'], ['37℃', '37 °C'], ['dna', 'DNA'], ['OD600', 'OD₆₀₀'],
        ['4h', '4 h'], ['2 h', '2 h'], ['10 倍', '10 倍'], ['第1章', '第1章'],
        ['2023年', '2023年'], ['H2O', 'H2O'], ['IC50', 'IC₅₀'], ['10^10', '10¹⁰'],
        ['mg / mL', 'mg/mL'], ['pH7.4', 'pH 7.4']
      ];
      unitCases.forEach(function (c) {
        var h = Engine._internals.newUnitHits();
        var got = Engine._internals.fixUnitString(c[0], uOpt, h);
        check('单位规范：' + c[0] + ' → ' + c[1], got === c[1], got);
      });

      var uDoc = await Ooxml.fromParagraphs([{ text: '取 10μL 样品，加入 15KD 蛋白，抑制率 95 %，P<0.05，转速 12000 RPM，37℃ 孵育 30 sec，浓度 5 ng / μL。' }],
        { title: 'u', fileName: 'u.docx' });
      var uRes = await Engine.process(uDoc, Store.merge(DFT.DEFAULT_PARAMS, { unit: { enabled: true } }));
      var uOut = await Ooxml.open(await uRes.blob.arrayBuffer(), 'u2.docx');
      var uText = texts(uOut.xml).join('');
      out('  整改后：' + uText);
      check('端到端：单位拼写与空格全部修正',
        uText.indexOf('10 μL') >= 0 && uText.indexOf('15 kDa') >= 0 && uText.indexOf('95%') >= 0 &&
        uText.indexOf('P < 0.05') >= 0 && uText.indexOf('12000 rpm') >= 0 &&
        uText.indexOf('30 s') >= 0 && uText.indexOf('5 ng/μL') >= 0, uText);
      check('端到端：报告记录了修正处数', uRes.report.unitFixed > 5, uRes.report.unitFixed);
      var uOff = await Engine.process(uDoc, Store.merge(DFT.DEFAULT_PARAMS, { unit: { enabled: false } }));
      var uOffDoc = await Ooxml.open(await uOff.blob.arrayBuffer(), 'u3.docx');
      check('默认关闭时完全不动原文', texts(uOffDoc.xml).join('').indexOf('10μL') >= 0,
        texts(uOffDoc.xml).join(''));
      var uScan = Engine.analyze(uDoc, DFT.DEFAULT_PARAMS);
      var uFinding = uScan.findings.filter(function (x) { return x.id === 'unit_format'; })[0];
      check('格式检测能报出"数字与单位不规范"', !!uFinding && uFinding.count >= 6,
        uFinding ? (uFinding.count + ' 处：' + uFinding.detail.slice(0, 60)) : '未报出');
    } catch (e) {
      failed++;
      out('!! 异常: ' + e.message + '\n' + (e.stack || ''));
    }
    out('');
    out(failed ? ('===== 测试结束：' + failed + ' 项失败 =====') : '===== 全部测试通过 =====');
    out('__TEST_DONE__');
  })();
})();
</script>
</body>
</html>
